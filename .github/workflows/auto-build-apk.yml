name: Auto Unzip & Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'آدرس اینترنتی فایل زیپ (اختیاری)'
        required: false
        default: ''

jobs:
  build-apk:
    name: 🚀 استخراج خودکار زیپ و ساخت APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 ۱. دریافت مخزن (Checkout)
        uses: actions/checkout@v4

      - name: 📦 ۲. شناسایی و استخراج خودکار فایل زیپ
        run: |
          echo "=== مرحله بررسی و اکسترکت فایل زیپ ==="
          
          # بررسی آیا پروژه قبلاً استخراج شده یا خیر
          if [ -f "./gradlew" ] || [ -f "./android/gradlew" ]; then
            echo "پروژه قبلاً استخراج شده است."
          else
            # ۱. اگر آدرس دانلود اختصاصی داده شده باشد
            if [ -n "${{ github.event.inputs.zip_url }}" ]; then
              echo "در حال دانلود زیپ از آدرس وارد شده..."
              curl -sL "${{ github.event.inputs.zip_url }}" -o project.zip
              ZIP_FILE="project.zip"
            else
              # ۲. پیدا کردن هر فایل زیپی که در ریپازیتوری آپلود کرده‌اید
              FOUND_ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)
              if [ -n "$FOUND_ZIP" ]; then
                echo "فایل زیپ در ریپازیتوری پیدا شد: $FOUND_ZIP"
                ZIP_FILE="$FOUND_ZIP"
              else
                echo "دانلود خودکار فایل سورس پروژه..."
                curl -sL "https://tmpfiles.org/dl/1792602444.278517c34f8b1339/wQATM2V7ZAgm/lingoworld-android-full-github-project.zip" -o project.zip
                ZIP_FILE="project.zip"
              fi
            fi

            echo "در حال اکسترکت کردن $ZIP_FILE..."
            unzip -o -q "$ZIP_FILE" -d ./
          fi

          # پیدا کردن مسیر فایل gradlew
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "::error::فایل gradlew پیدا نشد!"
            exit 1
          fi

          WORK_DIR=$(dirname "$GRADLEW_FILE")
          echo "پوشه کاری پروژه: $WORK_DIR"
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLEW_FILE"

      - name: ☕ ۳. راه‌اندازی جاوا ۱۷ (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 ۴. تایید مجوزهای اندروید
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🔨 ۵. ساخت خودکار فایل APK با گرادل
        run: |
          cd "$WORK_DIR"
          # تنظیم اتوماتیک و قطعی AndroidX در تنظیمات گرادل
          touch gradle.properties
          if ! grep -q "android.useAndroidX" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          if ! grep -q "android.nonTransitiveRClass" gradle.properties; then
            echo "android.nonTransitiveRClass=true" >> gradle.properties
          fi
          if ! grep -q "org.gradle.jvmargs" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          
          echo "تنظیمات گرادل اعمال شد:"
          cat gradle.properties

          echo "در حال کامپایل APK در مسیر $(pwd)..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📂 ۶. جمع‌آوری فایل‌های خروجی APK
        run: |
          mkdir -p output_apk
          find . -type f -name "*.apk" -exec cp -v {} output_apk/ \;
          ls -lh output_apk/

      - name: 📤 ۷. آپلود APK در Artifacts گیت‌هاب (آماده دانلود)
        uses: actions/upload-artifact@v4
        with:
          name: LingoWorld-Android-App-APK
          path: output_apk/*.apk
          retention-days: 30

      - name: ✨ ۸. گزارش موفقیت در Actions
        run: |
          echo "## 🎉 تبریک! فایل APK با موفقیت ساخته شد" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "فایل زیپ به صورت ۱۰۰٪ خودکار آنزیپ شد و کامپایل اندروید با موفقیت پایان یافت." >> $GITHUB_STEP_SUMMARY
          echo "می‌توانید فایل APK را از کادر **Artifacts** در بالای همین صفحه دانلود و روی گوشی نصب نمایید." >> $GITHUB_STEP_SUMMARY
